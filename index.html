<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>初中化学虚拟实验训练平台</title>
<link rel="stylesheet" href="css-style.css">
</head>
<body>

<div class="home-wrap">
  <div class="home-top">
    <div>
      <h1>🧪 初中化学虚拟实验训练平台</h1>
      <div class="sub">拖拽操作 · 手势模拟 · 自动评分 · 成绩可导出</div>
    </div>
    <div class="home-tools">
      <input id="stuName" class="name-input" placeholder="输入你的姓名" maxlength="20">
      <button class="primary" onclick="location.href='drill.html'">📇 记忆卡练习</button>
      <button class="ghost" onclick="Home.exportAll()">导出全部成绩</button>
      <button class="ghost" onclick="location.href='teacher.html'">教师端</button>
    </div>
  </div>

  <div class="vx-banner">
    <div class="vx-text">
      <h3>📩 想要配套 PDF 练习册 / 1 对 1 答疑？</h3>
      <p>扫码加老师微信，<b>免费领《初中化学方程式默写册》</b>（34 条可打印版），并有偿提供错题答疑与定制资料。</p>
      <p class="vx-sub">微信号：<b>love666y1</b>　·　备注「化学练习」资料秒发 ✅</p>
    </div>
    <div class="vx-qr">
      <img src="wechat.png" alt="微信二维码" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="qr-ph">微信号：<b>love666y1</b><br>或放入 <code>wechat.png</code> 二维码图</div>
    </div>
  </div>

  <div class="sec-title">选择实验 <small id="expCount"></small></div>
  <div id="expGrid" class="exp-grid">
    <div class="empty">正在加载实验…</div>
  </div>

  <div class="sec-title">我的记录 <small>本浏览器的练习历史</small></div>
  <div id="recBox">
    <div class="empty">还没有练习记录，做完一次实验后会自动出现在这里。</div>
  </div>
</div>

<div id="toast"></div>

<script src="js-core.js"></script>
<script src="data-bundle.js" onerror="window.__noBundle=true"></script>
<script src="js-home.js"></script>

<script>
/* ------------------------------------------------------------------
 * 兜底实验清单
 * 作用：当 data-bundle.js 或 data-experiments.json 还没同步到最新版时，
 *       首页依然能显示全部实验卡片，不会出现"只剩两个实验"的情况。
 * 注意：以后新增实验，把新实验的一行加到下面的数组里即可（同时也要加到
 *       data-experiments.json，两边保持一致）。
 * ------------------------------------------------------------------ */
window.LAB_LIST_FALLBACK = [
  { "id": "kmno4", "name": "高锰酸钾制取氧气", "iconEmoji": "🔥", "desc": "固体加热型发生装置，排水法收集，带火星木条检验。", "method": "排水法", "group": "气体制取与检验", "max": 100 },
  { "id": "h2o2",  "name": "过氧化氢制取氧气", "iconEmoji": "💧", "desc": "固液常温型发生装置，MnO₂ 催化，排水法收集。", "method": "排水法", "group": "气体制取与检验", "max": 100 },
  { "id": "co2",   "name": "实验室制取二氧化碳", "iconEmoji": "🫧", "desc": "固液常温型发生装置，向上排空气法收集，澄清石灰水检验。", "method": "向上排空气法", "group": "气体制取与检验", "max": 100 },
  { "id": "h2",    "name": "实验室制取氢气", "iconEmoji": "🎈", "desc": "锌粒与稀硫酸，向下排空气法收集，点燃前必须验纯。", "method": "向下排空气法", "group": "气体制取与检验", "max": 100 },
  { "id": "o2air", "name": "测定空气里氧气的含量", "iconEmoji": "📏", "desc": "红磷燃烧消耗氧气，水倒吸入集气瓶，测得氧气约占 1/5。", "method": "压强法", "group": "气体制取与检验", "max": 100 },
  { "id": "water", "name": "水的组成 —— 电解水", "iconEmoji": "⚡", "desc": "通直流电分解水，正氧负氢、体积比 1:2，推出水的元素组成。", "method": "电解法", "group": "气体制取与检验", "max": 100 },

  { "id": "co2naoh",    "name": "二氧化碳与氢氧化钠反应", "iconEmoji": "🥤", "desc": "没有明显现象的反应：用塑料瓶变瘪和对照实验把它显示出来。", "method": "压强法 + 对照", "group": "性质探究", "max": 100 },
  { "id": "cao",        "name": "生石灰与水反应放热", "iconEmoji": "🌡️", "desc": "CaO + H₂O = Ca(OH)₂，温度计飙升的背后是干燥剂的原理。", "method": "温度变化法", "group": "性质探究", "max": 100 },
  { "id": "neutral",    "name": "酸和碱的中和反应", "iconEmoji": "🧪", "desc": "酚酞变红后逐滴加酸至恰好褪色，看懂 H⁺ + OH⁻ = H₂O。", "method": "指示剂法", "group": "性质探究", "max": 100 },
  { "id": "metalacid",  "name": "金属与稀盐酸的反应", "iconEmoji": "⚙️", "desc": "三支试管同时比气泡：Mg > Zn > Fe，顺便点燃检验氢气。", "method": "对比实验法", "group": "性质探究", "max": 100 },
  { "id": "fecuso4",    "name": "铁与硫酸铜溶液的反应", "iconEmoji": "🪙", "desc": "铁丝表面长出红色的铜，蓝溶液变浅绿：这就是湿法炼铜。", "method": "置换法", "group": "性质探究", "max": 100 },
  { "id": "ions",       "name": "硫酸根与氯离子的检验", "iconEmoji": "🔎", "desc": "BaCl₂ 和 AgNO₃ 各显本领，稀硝酸负责排除碳酸根的干扰。", "method": "沉淀加酸法", "group": "性质探究", "max": 100 },
  { "id": "precip",     "name": "碱与盐的沉淀反应", "iconEmoji": "🎨", "desc": "蓝色、红褐色、白色三种沉淀，一次记牢复分解的发生条件。", "method": "沉淀法", "group": "性质探究", "max": 100 },
  { "id": "cuso4water", "name": "无水硫酸铜检验水", "iconEmoji": "💠", "desc": "白色粉末遇水变蓝，对照无水乙醇，学会检验水的存在。", "method": "显色法", "group": "性质探究", "max": 100 }
];

(function () {
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function bestOf(id) {
    var rs = [];
    try { rs = JSON.parse(localStorage.getItem('lab_records') || '[]'); } catch (e) { }
    var best = null;
    rs.forEach(function (r) { if (r.experiment === id && (!best || r.score > best.score)) best = r; });
    return best;
  }
  function paint() {
    var box = document.getElementById('expGrid');
    var want = window.LAB_LIST_FALLBACK;
    if (!box || !want.length) return;
    /* 已经渲染出足够多的卡片（说明清单文件是最新的），就不干预
     * +1 是因为最后还有一张「记忆卡练习」入口卡 */
    if (box.querySelectorAll('.exp-card').length >= want.length + 1) return;
    var cnt = document.getElementById('expCount');
    if (cnt) cnt.textContent = '共 ' + want.length + ' 个';
    /* 按 group 分段显示，和 home.js 的正常渲染保持一致 */
    var order = [], map = {};
    want.forEach(function (e) {
      var g = e.group || '其他实验';
      if (!map[g]) { map[g] = []; order.push(g); }
      map[g].push(e);
    });
    function card(e) {
      var best = bestOf(e.id);
      return '<div class="exp-card" onclick="location.href=\'experiment.html?id=' + encodeURIComponent(e.id) + '\'">'
        + '<div class="ic">' + (e.iconEmoji || '🧪') + '</div>'
        + '<h3>' + esc(e.name) + '</h3>'
        + '<p>' + esc(e.desc || '') + '</p>'
        + '<div class="meta">'
        +   '<span>满分 ' + (e.max || 100) + ' 分</span>'
        +   '<span>' + esc(e.method || '') + '</span>'
        +   (best ? '<span style="background:#dcfce7;color:#15803d">最好成绩 ' + best.score + '</span>' : '<span>未练习</span>')
        + '</div></div>';
    }
    box.innerHTML = order.map(function (g) {
      return '<div class="grp-hd"><span>' + esc(g) + '</span><em>' + map[g].length + ' 个</em><i></i></div>'
        + map[g].map(card).join('');
    }).join('') + drillCard();
  }

  /* 记忆卡练习入口（固定在最后） */
  function drillCard() {
    var best = null;
    try {
      JSON.parse(localStorage.getItem('lab_records') || '[]').forEach(function (r) {
        if (String(r.experiment || '').indexOf('drill:') === 0 && (!best || r.rate > best.rate)) best = r;
      });
    } catch (e) { }
    return '<div class="grp-hd"><span>记忆与自测</span><em>34 条</em><i></i></div>'
      + '<div class="exp-card" style="border-color:#bfdbfe;background:linear-gradient(160deg,#f8fbff,#fff)" '
      + 'onclick="location.href=\'drill.html\'">'
      + '<div class="ic">📇</div>'
      + '<h3>化学方程式记忆卡</h3>'
      + '<p>34 条核心方程式：默写、四选一、看图判断、补全化学式，自动判分并记入成绩。</p>'
      + '<div class="meta">'
      + '<span>满分 100 分</span><span>4 种题型</span>'
      + (best ? '<span style="background:#dcfce7;color:#15803d">最好正确率 ' + best.rate + '%</span>' : '<span>未练习</span>')
      + '</div></div>';
  }
  /* home.js 的数据加载是异步的，多刷几次确保覆盖掉旧清单的渲染结果 */
  [0, 200, 700, 1500, 3000].forEach(function (t) { setTimeout(paint, t); });
})();
</script>
</body>
</html>
